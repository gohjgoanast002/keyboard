<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>이미정 선생님 키보드 키 연습실 - Space, Enter, Backspace, Delete</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f7ff; --card:#ffffff; --ink:#14213d; --muted:#46557a; --line:#cfdcf7;
  --blue:#3266e3; --blue2:#7466ff; --orange:#c9520f; --on-accent:#ffffff;
  --stage:#f6f9ff; --stage-line:#b9cdf4; --badge-bg:#fff1c2; --badge-ink:#8a3b00;
  --good:#1f9d55; --bad:#d64545; --glow:rgba(255,214,102,.30);
  --key:#f4f7fd; --key-edge:#c5d1ea; --key-ink:#5a6a8f;
  --keycap-top:#f7f9fd; --keycap-bot:#d5dcec; --keycap-edge:#8f9ebf;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0e1530; --card:#172046; --ink:#eef2ff; --muted:#a9b6dc; --line:#2e3b70;
    --blue:#5b8cff; --blue2:#8b7bff; --orange:#ff9a55; --on-accent:#0b1230;
    --stage:#111a3b; --stage-line:#3a4b8a; --badge-bg:#4a3a12; --badge-ink:#ffdf8a;
    --good:#4cc47f; --bad:#ff8080; --glow:rgba(255,214,102,.10);
    --key:#1d2a55; --key-edge:#3a4b8a; --key-ink:#9fb0e0;
    --keycap-top:#26356b; --keycap-bot:#1a2450; --keycap-edge:#5a6cad;
  }
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',system-ui,sans-serif;font-weight:500;line-height:1.5;min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:4px solid var(--blue);outline-offset:3px}
.display{font-family:'Black Han Sans','Noto Sans KR','Malgun Gothic',sans-serif;font-weight:400;letter-spacing:.01em}

.top{max-width:1180px;margin:0 auto;padding:16px 24px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.brand{font-weight:800;font-size:18px;display:flex;gap:8px;align-items:center}
.ghost{background:var(--card);border:3px solid var(--line);border-radius:999px;padding:6px 16px;font-weight:700;font-size:15px}
main{max-width:1180px;margin:0 auto;padding:0 24px 64px}

/* ---------- 미니 키보드 ---------- */
.map-card{background:var(--card);border:3px solid var(--line);border-radius:34px;padding:18px 22px 16px;margin-bottom:24px;box-shadow:0 18px 40px -28px rgba(50,102,227,.5)}
.map-cap{margin:10px 0 0;text-align:center;font-weight:700;color:var(--muted);font-size:15px}
.kb{--u:min(4.4vw,44px);display:flex;justify-content:center;gap:calc(var(--u)*.6);align-items:flex-start}
.kb .row{display:flex;height:var(--u)}
.k{flex:0 0 calc(var(--u)*var(--w));padding:calc(var(--u)*.05)}
.k>span{display:grid;place-items:center;height:100%;border-radius:calc(var(--u)*.2);background:var(--key);border:1px solid var(--key-edge);color:var(--key-ink);font-size:calc(var(--u)*.3);font-weight:700;overflow:hidden;white-space:nowrap}
.k.on>span{background:var(--blue);border-color:var(--blue);color:var(--on-accent);font-weight:800;animation:pulse 1.2s ease-in-out infinite;position:relative;z-index:2;box-shadow:0 0 0 calc(var(--u)*.08) color-mix(in srgb,var(--blue) 35%,transparent)}
@keyframes pulse{0%,100%{filter:none}50%{filter:brightness(1.25)}}

/* ---------- 연습 판 ---------- */
.board{display:grid;grid-template-columns:minmax(300px,400px) 1fr;gap:28px;align-items:stretch}
.mission-card{background:linear-gradient(180deg,var(--card),color-mix(in srgb,var(--card) 60%,var(--stage)));border:3px solid var(--line);border-radius:38px;padding:22px 22px 26px;display:flex;flex-direction:column;gap:16px;align-items:center;box-shadow:0 18px 40px -26px rgba(50,102,227,.5)}
.title-row{display:flex;flex-wrap:wrap;gap:10px 12px;align-items:center;justify-content:center}
.title-pill{margin:0;display:inline-flex;align-items:center;gap:12px;padding:6px 26px 6px 18px;border-radius:999px;background:var(--card);border:6px solid var(--line);font-size:clamp(24px,2.6vw,36px);line-height:1.25;transition:border-color .2s}
.title-pill[data-tone="add"]{border-color:color-mix(in srgb,var(--blue) 55%,var(--line))}
.title-pill[data-tone="erase"]{border-color:color-mix(in srgb,var(--orange) 60%,var(--line))}
.title-pill .g{font-family:'Segoe UI Symbol','Apple Symbols','Noto Sans Symbols 2',sans-serif;font-size:1.05em}
.badge{background:var(--badge-bg);color:var(--badge-ink);font-weight:800;font-size:15px;padding:6px 16px;border-radius:999px}

.keycap{width:min(100%,330px);padding:22px 12px;text-align:center;border:8px solid var(--keycap-edge);border-radius:34px;background:linear-gradient(180deg,var(--keycap-top) 0 68%,var(--keycap-bot));box-shadow:0 12px 0 -2px var(--keycap-edge),0 22px 26px -14px rgba(40,60,110,.5);font-size:clamp(28px,3vw,40px);line-height:1.1;transition:transform .06s,box-shadow .06s}
.keycap.down{transform:translateY(8px);box-shadow:0 3px 0 -2px var(--keycap-edge),0 8px 12px -8px rgba(40,60,110,.5)}
.keycap.wide{width:100%}
.mission{margin:0;text-align:center;font-size:17px;font-weight:700;color:var(--muted)}
.mission b{color:var(--ink);font-weight:800}
.tip{margin:0;text-align:center;font-size:15px;font-weight:700;color:var(--badge-ink);background:var(--badge-bg);border-radius:16px;padding:6px 14px}
.dots{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;align-items:center}
.dots i{width:14px;height:14px;border-radius:50%;background:var(--line);transition:background .2s,transform .2s}
.dots i.on{background:var(--good);transform:scale(1.15)}
.dots span{font-weight:800;font-size:14px;color:var(--muted);margin-left:6px}
.modes{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.modes button{border:3px solid var(--blue);background:var(--card);color:var(--blue);font-weight:800;font-size:16px;padding:8px 18px;border-radius:999px}
.modes button[aria-pressed="true"]{background:linear-gradient(135deg,var(--blue),var(--blue2));border-color:transparent;color:var(--on-accent);box-shadow:0 10px 18px -10px rgba(70,90,240,.8)}

.stage{position:relative;min-height:440px;border:3px dashed var(--stage-line);border-radius:38px;overflow:hidden;user-select:none;-webkit-user-select:none;
  background:radial-gradient(circle at 50% 0%,var(--glow),transparent 50%),var(--stage);display:grid;place-items:center;padding:24px}
.pair{display:flex;align-items:center;justify-content:center;gap:clamp(12px,3vw,36px);flex-wrap:wrap;width:100%}
.text-card{background:#fff;color:#14213d;border-radius:34px;padding:22px 34px;min-width:120px;min-height:1.6em;box-shadow:0 22px 36px -16px rgba(50,80,140,.4);font-family:'Black Han Sans','Noto Sans KR',sans-serif;line-height:1.18;text-align:center;transition:box-shadow .2s}
.text-card.ok{box-shadow:0 0 0 8px color-mix(in srgb,var(--good) 55%,transparent),0 22px 36px -16px rgba(50,80,140,.4)}
.arrow{font-size:40px;color:var(--muted);font-weight:700}
.target{font-family:'Black Han Sans','Noto Sans KR',sans-serif;color:var(--good);opacity:.7;line-height:1.18;text-align:center;white-space:pre}
.txt{white-space:pre}
.caret{display:inline-block;width:.07em;height:.95em;background:var(--blue);vertical-align:-.1em;margin:0 .02em;animation:blink 1s steps(2,start) infinite;border-radius:.03em}
@keyframes blink{to{visibility:hidden}}
.ch.x{color:var(--bad);background:color-mix(in srgb,var(--bad) 16%,transparent);border-radius:.12em;text-decoration:underline wavy var(--bad);text-decoration-thickness:.05em;text-underline-offset:.08em}
.ch.new,.sp.new{background:color-mix(in srgb,var(--good) 28%,transparent);border-radius:.12em}
.sp{display:inline-block;width:.34em;height:.9em;vertical-align:-.1em;border-radius:.1em}
.nl{font-size:.32em;color:var(--blue);vertical-align:middle;margin-left:.3em;font-family:'Segoe UI Symbol',sans-serif}
.shake{animation:shake .38s ease}
.pop{animation:pop .38s ease}
@keyframes shake{0%,100%{translate:0}20%{translate:-10px}40%{translate:10px}60%{translate:-7px}80%{translate:7px}}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.06)}100%{transform:scale(1)}}

.win{position:absolute;inset:0;z-index:30;display:grid;place-items:center;background:color-mix(in srgb,var(--stage) 82%,transparent);backdrop-filter:blur(3px)}
.win-card{background:var(--card);border:4px solid var(--line);border-radius:32px;padding:28px 36px;text-align:center;animation:pop .5s ease;max-width:88%}
.win-card .we{font-size:64px;line-height:1.1}
.win-card h3{margin:6px 0 4px;font-size:32px}
.win-card p{margin:0 0 18px;color:var(--muted);font-weight:700}
.win-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.win-actions button{border:3px solid var(--line);background:var(--card);border-radius:999px;padding:10px 22px;font-weight:800;font-size:17px}
.win-actions button.main{background:linear-gradient(135deg,var(--blue),var(--blue2));border-color:transparent;color:var(--on-accent)}

.bar{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;margin-top:24px}
.primary{border:0;color:var(--on-accent);font-weight:800;font-size:20px;padding:16px 30px;border-radius:999px;background:linear-gradient(135deg,var(--blue),var(--blue2));box-shadow:0 12px 24px -10px rgba(70,90,240,.7)}
:root .primary{color:#fff}
@media (prefers-color-scheme: dark){:root .primary{color:#0b1230}}
.primary:active{transform:translateY(2px)}
.bar-text{display:flex;flex-direction:column}
#hint{margin:0;font-size:19px;font-weight:800}
.note{margin:0;font-size:14px;color:var(--muted)}

@media (max-width:900px){
  .board{grid-template-columns:1fr}
  .stage{min-height:380px;padding:16px}
  main{padding:0 16px 48px}
  .top{padding:12px 16px}
  .map-card{padding:14px 12px}
}
@media (prefers-reduced-motion: reduce){
  .caret,.k.on>span,.win-card{animation:none!important}
}
</style>
</head>
<body>

<header class="top">
  <div class="brand">⌨️ <span>이미정 선생님 키보드 키 연습실</span></div>
  <button class="ghost" id="soundBtn" aria-pressed="true">🔊 소리 켬</button>
</header>

<main>
  <section class="map-card" aria-label="키보드에서 키 위치 보기">
    <div class="kb" id="kb"></div>
    <p class="map-cap" id="mapCap"></p>
  </section>

  <div class="board">
    <aside class="mission-card">
      <div class="title-row">
        <h2 class="title-pill display" id="pill"><span class="g" id="pillG"></span><span id="pillT"></span></h2>
        <span class="badge" id="badge"></span>
      </div>
      <div class="keycap display" id="keycap"><span id="keycapT"></span></div>
      <p class="mission"><b>미션:</b> <span id="mission"></span></p>
      <p class="tip" id="tip"></p>
      <div class="dots" id="dots" aria-live="polite"></div>
      <div class="modes" id="modes" role="group" aria-label="연습할 키 고르기"></div>
    </aside>

    <div class="stage" id="stage">
      <div class="pair" id="pair">
        <div class="text-card" id="card"><div class="txt" id="txt" aria-live="polite"></div></div>
        <div class="arrow" aria-hidden="true">→</div>
        <div class="target" id="target" aria-label="만들어야 하는 결과"></div>
      </div>
    </div>
  </div>

  <div class="bar">
    <button class="primary" id="againBtn">다시 하기</button>
    <div class="bar-text">
      <p id="hint" aria-live="polite"></p>
      <p class="note">키보드가 반응하지 않으면 화면을 한 번 클릭하세요.</p>
    </div>
  </div>
</main>

<script>
(function(){
'use strict';
const $=(s,r=document)=>r.querySelector(s);
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

/* =========================================================
   연습 문제 데이터 (여기를 고치면 문제를 바꿀 수 있어요)
   ^  : 커서(깜빡이는 막대) 위치
   {} : 잘못 들어간 글자 (빨간색으로 표시돼요)
   ========================================================= */
const KEYS={
  space:{
    code:'Space', label:'Space', name:'SPACEBAR', glyph:'␣', tone:'add', badge:'빈칸 넣기',
    mission:'Space(스페이스바)를 눌러 글자 사이에 빈칸을 넣으세요.',
    tip:'커서( | )가 있는 자리에 빈칸이 생겨요.',
    hint:'커서 자리에서 Space 키를 누르세요.',
    where:'Space는 키보드 맨 아래에 있는 가장 긴 키예요.',
    rounds:['cat^dog','red^apple','good^morning','sunny^day','happy^birthday']
  },
  enter:{
    code:'Enter', label:'Enter', name:'ENTER', glyph:'↵', tone:'add', badge:'줄 바꾸기',
    mission:'Enter(엔터)를 눌러 줄을 바꾸세요.',
    tip:'커서( | ) 자리에서 새 줄이 시작돼요.',
    hint:'커서 자리에서 Enter 키를 누르세요.',
    where:'Enter는 키보드 오른쪽, 글자 키 바로 옆에 있어요.',
    rounds:['Hello^World','Red^Blue','Mon^Tue','Apple^Banana','Top^Bottom']
  },
  backspace:{
    code:'Backspace', label:'Backspace', name:'BACKSPACE', glyph:'⌫', tone:'erase', badge:'뒤로 지우기',
    mission:'Backspace(백스페이스)를 눌러 빨간 글자를 지우세요.',
    tip:'Backspace는 커서( | ) 왼쪽 글자를 지워요.',
    hint:'Backspace 키를 눌러 커서 왼쪽의 빨간 글자를 지우세요.',
    where:'Backspace는 키보드 오른쪽 위 끝에 있는 긴 키예요.',
    rounds:['fish{h}^','cat{t}^','dog{g}^','book{k}^','hello{oo}^']
  },
  delete:{
    code:'Delete', label:'Delete', name:'DELETE', glyph:'⌦', tone:'erase', badge:'앞으로 지우기',
    mission:'Delete(딜리트)를 눌러 빨간 글자를 지우세요.',
    tip:'Delete는 커서( | ) 오른쪽 글자를 지워요.',
    hint:'Delete 키를 눌러 커서 오른쪽의 빨간 글자를 지우세요.',
    where:'Delete는 방향키 위쪽 여섯 개 키 묶음 안에 있어요. (노트북은 오른쪽 위에 따로 있기도 해요.)',
    rounds:['c^{a}at','d^{o}og','h^{h}at','app^{p}le','s^{u}un']
  }
};
const MODES=[
  {id:'space',text:'Space'},{id:'enter',text:'Enter'},{id:'backspace',text:'Backspace'},{id:'delete',text:'Delete'},{id:'mixed',text:'섞어서'}
];
const CODE2KEY={Space:'space',Enter:'enter',NumpadEnter:'enter',Backspace:'backspace',Delete:'delete'};

/* ---------- 소리 ---------- */
let soundOn=true, ac=null;
function tone(f,d=.1,type='sine',v=.07,delay=0){
  if(!soundOn) return;
  try{
    ac=ac||new (window.AudioContext||window.webkitAudioContext)();
    const o=ac.createOscillator(), g=ac.createGain(), t=ac.currentTime+delay;
    o.type=type; o.frequency.value=f;
    g.gain.setValueAtTime(v,t); g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t+d+.03);
  }catch(e){}
}
const sfx={
  key:()=>tone(440,.06,'square',.03),
  ok:()=>{tone(660,.1);tone(880,.14,'sine',.07,.08)},
  no:()=>tone(180,.2,'triangle',.09),
  win:()=>[523,659,784,1046].forEach((f,i)=>tone(f,.2,'sine',.07,i*.1))
};
$('#soundBtn').addEventListener('click',e=>{
  soundOn=!soundOn;
  e.currentTarget.textContent=soundOn?'🔊 소리 켬':'🔇 소리 끔';
  e.currentTarget.setAttribute('aria-pressed',String(soundOn));
  e.currentTarget.blur();
});

/* ---------- 미니 키보드 그리기 ---------- */
(function buildKeyboard(){
  const ch=s=>s.split('').map(c=>[c,1]);
  const main=[
    ch('`1234567890-=').concat([['Backspace',2,'backspace']]),
    [['Tab',1.5]].concat(ch('QWERTYUIOP[]'),[['\\',1.5]]),
    [['Caps',1.75]].concat(ch("ASDFGHJKL;'"),[['Enter',2.25,'enter']]),
    [['Shift',2.25]].concat(ch('ZXCVBNM,./'),[['Shift',2.75]]),
    [['Ctrl',1.25],['Win',1.25],['Alt',1.25],['Space',6.25,'space'],['Alt',1.25],['Win',1.25],['Menu',1.25],['Ctrl',1.25]]
  ];
  const cluster=[
    [['Ins',1],['Home',1],['PgUp',1]],
    [['Del',1,'delete'],['End',1],['PgDn',1]]
  ];
  const rows=(list)=>list.map(r=>`<div class="row">${r.map(([l,w,id])=>`<div class="k" style="--w:${w}"${id?` data-k="${id}"`:''}><span>${l.replace(/&/g,'&amp;')}</span></div>`).join('')}</div>`).join('');
  $('#kb').innerHTML=`<div>${rows(main)}</div><div>${rows(cluster)}</div>`;
})();

/* ---------- 상태 ---------- */
let mode='backspace', rounds=[], idx=0, lock=false, over=false;
let chars=[], caret=0, target='', curKey='backspace';

function parse(s,key){
  const cs=[]; let c=0, inx=false;
  for(const ch of s){
    if(ch==='^') c=cs.length;
    else if(ch==='{') inx=true;
    else if(ch==='}') inx=false;
    else cs.push({c:ch,x:inx,n:false});
  }
  const before=cs.slice(0,c).map(o=>o.c).join(''), after=cs.slice(c).map(o=>o.c).join('');
  let t;
  if(key==='space') t=before+' '+after;
  else if(key==='enter') t=before+'\n'+after;
  else t=cs.filter(o=>!o.x).map(o=>o.c).join('');
  return {cs,c,t};
}

function buildRounds(m){
  if(m!=='mixed') return KEYS[m].rounds.map(s=>({key:m,s}));
  let all=[];
  Object.keys(KEYS).forEach(k=>{
    all=all.concat(shuffle(KEYS[k].rounds).slice(0,2).map(s=>({key:k,s})));
  });
  return shuffle(all);
}

/* ---------- 화면 그리기 ---------- */
const card=$('#card'), txt=$('#txt'), tgt=$('#target'), keycap=$('#keycap'), stage=$('#stage');
function hint(t){$('#hint').textContent=t}
function progress(){
  const N=rounds.length;
  $('#dots').innerHTML=Array.from({length:N},(_,i)=>`<i class="${i<idx?'on':''}"></i>`).join('')+`<span>${idx} / ${N}</span>`;
}
function fx(el,cls){
  el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls);
  const h=()=>{el.classList.remove(cls);el.removeEventListener('animationend',h)};
  el.addEventListener('animationend',h);
}
function charHTML(o){
  if(o.c==='\n') return `<span class="nl">↵</span><br>`;
  if(o.c===' ') return `<span class="sp${o.n?' new':''}"></span>`;
  return `<span class="ch${o.x?' x':''}${o.n?' new':''}">${esc(o.c)}</span>`;
}
function renderText(){
  let h='';
  chars.forEach((o,i)=>{ if(i===caret) h+='<i class="caret"></i>'; h+=charHTML(o); });
  if(caret===chars.length) h+='<i class="caret"></i>';
  txt.innerHTML=h;
}
function fit(){
  const W=stage.clientWidth-48, stacked=W<540;
  const avail=(stacked?W:(W-90)/2)-70;
  const lines=(t)=>t.split('\n').reduce((m,l)=>Math.max(m,l.length),1);
  const longest=Math.max(lines(target),chars.filter(o=>o.c!=='\n').length,1);
  const fs=Math.max(28,Math.min(84,avail/(longest*.62)));
  card.style.fontSize=fs+'px'; tgt.style.fontSize=fs+'px';
}
function setKeyUI(key){
  const K=KEYS[key]; curKey=key;
  $('#pillG').textContent=K.glyph; $('#pillT').textContent=K.name;
  $('#pill').dataset.tone=K.tone;
  $('#badge').textContent=mode==='mixed'?'섞어서 연습':K.badge;
  $('#keycapT').textContent=K.name;
  keycap.classList.toggle('wide',key==='space');
  $('#mission').textContent=K.mission;
  $('#tip').textContent=K.tip;
  $('#mapCap').textContent=K.where;
  document.querySelectorAll('.k.on').forEach(e=>e.classList.remove('on'));
  document.querySelectorAll(`.k[data-k="${key}"]`).forEach(e=>e.classList.add('on'));
}
function loadRound(){
  lock=false; card.classList.remove('ok');
  const r=rounds[idx], p=parse(r.s,r.key);
  chars=p.cs; caret=p.c; target=p.t;
  setKeyUI(r.key);
  hint(KEYS[r.key].hint);
  tgt.innerHTML=esc(target);
  renderText(); fit(); progress();
}
function start(){
  over=false; const old=$('.win',stage); if(old) old.remove();
  rounds=buildRounds(mode); idx=0; loadRound();
  document.querySelectorAll('#modes button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.m===mode)));
}
function nextMode(){
  const i=MODES.findIndex(m=>m.id===mode);
  mode=MODES[(i+1)%MODES.length].id; start();
}
function win(){
  over=true; sfx.win(); hint('모두 성공했어요! 🎉');
  const el=document.createElement('div'); el.className='win';
  const name=mode==='mixed'?'섞어서':KEYS[mode].label;
  el.innerHTML=`<div class="win-card"><div class="we">🎉</div><h3 class="display">잘했어요!</h3><p>${name} 연습을 마쳤어요.</p><div class="win-actions"><button data-a="again">다시 하기</button><button class="main" data-a="next">다음 연습</button></div></div>`;
  stage.appendChild(el);
  el.querySelector('[data-a=again]').addEventListener('click',e=>{e.currentTarget.blur();start()});
  el.querySelector('[data-a=next]').addEventListener('click',e=>{e.currentTarget.blur();nextMode()});
}

/* ---------- 모드 버튼 ---------- */
$('#modes').innerHTML=MODES.map(m=>`<button data-m="${m.id}" aria-pressed="false">${m.text}</button>`).join('');
$('#modes').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return;
  mode=b.dataset.m; b.blur(); start();
});
$('#againBtn').addEventListener('click',e=>{e.currentTarget.blur();start()});

/* ---------- 키보드 입력 ---------- */
function wrong(msg){ sfx.no(); fx(card,'shake'); hint(msg); }
function success(){
  lock=true; sfx.ok(); card.classList.add('ok'); fx(card,'pop');
  idx++; progress(); hint('맞아요! 잘했어요 👍');
  if(idx>=rounds.length) setTimeout(win,650);
  else setTimeout(loadRound,900);
}
const IGNORE=new Set(['Shift','Control','Alt','Meta','CapsLock','Tab','Escape','NumLock','ScrollLock','ContextMenu']);

document.addEventListener('keydown',e=>{
  if(over||e.ctrlKey||e.metaKey||e.altKey) return;
  const pressed=CODE2KEY[e.code];
  if(pressed) e.preventDefault();
  if(IGNORE.has(e.key)||/^F\d+$/.test(e.key)) return;
  if(pressed===curKey) keycap.classList.add('down');
  if(e.repeat||lock) return;
  const need=curKey;
  if(!pressed){
    if(e.key&&e.key.length===1) { sfx.no(); hint(`지금은 ${KEYS[need].label} 키를 눌러요.`); }
    return;
  }
  if(pressed!==need){ wrong(`이번에는 ${KEYS[need].label} 키예요. ${KEYS[pressed].label}는 다음에 연습해요!`); return; }

  if(need==='space'||need==='enter'){
    chars.splice(caret,0,{c:need==='space'?' ':'\n',x:false,n:true}); caret++;
  }else if(need==='backspace'){
    if(caret>0&&chars[caret-1].x){ chars.splice(caret-1,1); caret--; }
    else { wrong('커서( | ) 왼쪽에 있는 빨간 글자만 지워요.'); return; }
  }else if(need==='delete'){
    if(caret<chars.length&&chars[caret].x){ chars.splice(caret,1); }
    else { wrong('커서( | ) 오른쪽에 있는 빨간 글자만 지워요.'); return; }
  }
  sfx.key(); renderText(); fit();
  const now=chars.map(o=>o.c).join('');
  if(now===target) success();
});
document.addEventListener('keyup',e=>{
  if(CODE2KEY[e.code]&&!over) e.preventDefault();
  if(CODE2KEY[e.code]) keycap.classList.remove('down');
});
window.addEventListener('blur',()=>keycap.classList.remove('down'));
window.addEventListener('resize',fit);

start();
})();
</script>
</body>
